services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: pi-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./config:/etc/searxng:rw
      - ./data:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - FORCE_OWNERSHIP=true
